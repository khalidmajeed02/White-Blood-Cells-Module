<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>White blood cells: interactive class set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7FB;--surf:#FFFFFF;--surf2:#F2EDF5;--ink:#231A2F;--mute:#6B6178;--line:#DDD3E3;
  --accent:#4B3A8C;--onaccent:#FFFFFF;--hl:#D98E04;
  --rbc:#C8203E;--deoxy:#7E2141;--old:#9A5562;--nuc:#4B3A8C;--stem:#D9CBE8;--baso:#5F74C6;--baso2:#8C9BDB;
  --poly:#A77BB4;--orth:#E2899C;--lumen:#FBF0D8;--plasma:#EDCB72;--bili:#D9A21B;--mac:#CBD6EE;--epo:#1F8A80;
  --brown:#7B4A2A;--alpha:#ABA0E2;--beta:#EDAFC3;--heme:#D2691E;--mucosa:#F0A3B3;--jaund:#E2BE3A;
  --warn:#C62828;--ok:#2E7D57;--glass:#9AA3B5;--clay:#E3DDD5;--buffy:#ECE8F0;--feces:#C9A27E;--kid:#D97C8E;--okbg:#E2F3E9;--lumen2:#FFF9EC;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15111B;--surf:#1F1927;--surf2:#2A2333;--ink:#EFE9F4;--mute:#A89DB5;--line:#3D3447;
    --accent:#A99BF0;--onaccent:#15111B;--hl:#F2B33D;
    --rbc:#E8475F;--deoxy:#B23E62;--old:#B97A86;--nuc:#9D8DE6;--stem:#4E3F63;--baso:#7488DA;--baso2:#5B6AA8;
    --poly:#9C70AC;--orth:#D97389;--lumen:#2E2618;--plasma:#E2BF63;--bili:#F0B93A;--mac:#3A4A6E;--epo:#3CC3B4;
    --brown:#A8693F;--alpha:#6E60B8;--beta:#B76A86;--heme:#E88A3C;--mucosa:#C97585;--jaund:#E2BE3A;
    --warn:#FF6B6B;--ok:#52C28A;--glass:#7C8496;--clay:#5A544D;--buffy:#C9C4D2;--feces:#8C6A4C;--kid:#B95C70;--okbg:#16352A;--lumen2:#3A3020;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15111B;--surf:#1F1927;--surf2:#2A2333;--ink:#EFE9F4;--mute:#A89DB5;--line:#3D3447;
  --accent:#A99BF0;--onaccent:#15111B;--hl:#F2B33D;
  --rbc:#E8475F;--deoxy:#B23E62;--old:#B97A86;--nuc:#9D8DE6;--stem:#4E3F63;--baso:#7488DA;--baso2:#5B6AA8;
  --poly:#9C70AC;--orth:#D97389;--lumen:#2E2618;--plasma:#E2BF63;--bili:#F0B93A;--mac:#3A4A6E;--epo:#3CC3B4;
  --brown:#A8693F;--alpha:#6E60B8;--beta:#B76A86;--heme:#E88A3C;--mucosa:#C97585;--jaund:#E2BE3A;
  --warn:#FF6B6B;--ok:#52C28A;--glass:#7C8496;--clay:#5A544D;--buffy:#C9C4D2;--feces:#8C6A4C;--kid:#B95C70;--okbg:#16352A;--lumen2:#3A3020;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button:disabled{opacity:.4;cursor:default}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{padding:28px 18px;border-right:1px solid var(--line);position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.side h1{font-size:1.6rem;line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
.side .lede{margin:0 0 18px;color:var(--mute);font-size:.92rem}
.grp{font-size:.88rem;color:var(--mute);margin:18px 10px 4px;font-weight:700}
.nav a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.98rem;line-height:1.3}
.nav a .n{color:var(--mute);font-variant-numeric:tabular-nums;min-width:1.3em;text-align:right}
.nav a:hover{background:var(--surf2)}
.nav a[aria-current="page"]{background:var(--surf2);font-weight:700}
.nav a[aria-current="page"] .n{color:var(--accent)}
main{padding:28px 32px 48px;min-width:0}
.mhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.mhead h2{font-size:2rem;margin:0;line-height:1.12;letter-spacing:-.015em;max-width:30ch}
.mhead .ref{color:var(--mute);margin:6px 0 0;font-size:.95rem}
button{font:inherit;font-size:.95rem;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;line-height:1.2}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-weight:700;margin-left:6px}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,.node:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.scen{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px;min-height:4px}
.scen button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow-x:auto}
.stage>svg{display:block;width:100%;height:auto;min-width:620px}
.panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 28px;margin-top:16px;align-items:start}
.cap{font-size:1.22rem;line-height:1.5;max-width:66ch;margin:0}
.ask{margin:12px 0 0;padding:12px 16px;border-left:4px solid var(--hl);background:var(--surf2);border-radius:0 12px 12px 0;max-width:66ch;font-size:1.08rem}
.ask b.k{display:block;font-size:.85rem;color:var(--mute)}
.ask .ans{display:block;margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--okbg);border-left:5px solid var(--ok);font-weight:700;font-size:1.15rem;line-height:1.45;color:var(--ink)}
.ask .ans::before{content:"Why: ";color:var(--ok)}
.mq{margin:4px 0 10px;font-size:1.12rem;font-weight:700}
.mopts{display:grid;gap:8px}
.mopt{display:flex;gap:12px;align-items:flex-start;text-align:left;border-radius:12px;padding:10px 14px;background:var(--surf);border:1.5px solid var(--line);width:100%;font-size:1.02rem;line-height:1.4}
.mopt .ml{font-weight:700;color:var(--accent);min-width:1.1em}
.mopt:hover:not(:disabled){border-color:var(--accent)}
.mopt.right{border:2px solid var(--ok);background:var(--okbg)}
.mopt.right .ml{color:var(--ok)}
.mopt.wrong{border:2px solid var(--warn);text-decoration:line-through;text-decoration-color:var(--warn)}
.mopt:disabled{opacity:1;cursor:default}
.mopt.wrong:disabled{opacity:.7}
.mfb{margin:10px 0 0;font-weight:700;font-size:1.08rem}
.mfb.good{color:var(--ok)}.mfb.bad{color:var(--warn)}
#qBody .ask{border-left:0;background:none;padding:0;max-width:none}
#qBody .mq{font-size:1.25rem}
.qscore{text-align:center;font-size:3rem;font-weight:700;margin:10px 0 0;color:var(--accent)}
.showbtn{display:block;margin-top:10px;border:2px solid var(--ok);color:var(--ok);font-weight:700;background:var(--surf)}
.showbtn:hover{background:var(--okbg);border-color:var(--ok)}
.ask .hint{display:block;margin-top:6px;color:var(--mute);font-size:.9rem}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ctrl.single .stepbtn,.ctrl.single .toggle{display:none}
.count{color:var(--mute);font-variant-numeric:tabular-nums;font-size:.95rem;min-width:6.5em;text-align:right}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:.95rem;color:var(--mute);cursor:pointer;margin-right:6px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.extra{margin-top:20px}
.extra:empty{display:none}
.info{background:var(--surf2);border-radius:14px;padding:14px 18px;max-width:72ch;margin-top:12px}
.info h3{margin:0 0 4px;font-size:1.1rem}
.info p{margin:0}
.note{color:var(--mute);font-size:.9rem;max-width:72ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.labt{border-collapse:collapse;min-width:420px;font-size:.98rem}
.labt caption{text-align:left;font-weight:700;padding-bottom:6px}
.labt td,.labt th{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.labt th{color:var(--mute);font-weight:400}
.scroll{overflow-x:auto}
.calc{background:var(--surf2);border-radius:14px;padding:14px 18px;max-width:72ch}
.calc input[type=range]{width:100%;max-width:420px;accent-color:var(--rbc);display:block;margin:8px 0}
.labgrid{display:grid;grid-template-columns:minmax(220px,340px) minmax(0,1fr);gap:20px;padding:20px;align-items:start}
.labgrid svg{width:100%;height:auto;display:block}
.labctl label{display:block;margin:0 0 12px;font-weight:700}
.labctl select,.labctl input{font:inherit;display:block;margin-top:6px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);max-width:100%}
.labctl input{width:9em}
.fb{font-weight:700;min-height:1.5em;font-size:1.12rem}
.fb.good{color:var(--ok)} .fb.bad{color:var(--warn)}
.bars td{white-space:nowrap}
.bar{display:inline-block;height:12px;border-radius:6px;vertical-align:middle;margin-right:8px}
.case{background:var(--surf2);border-radius:14px;padding:14px 18px;max-width:72ch;margin-top:12px}
.case p{margin:8px 0 0}
.case .ct{font-size:1.12rem}
.esr-list{max-width:72ch;padding-left:1.2em}
.esr-list li{margin:6px 0}
.f-surf{fill:var(--surf)}
.pent{fill:var(--surf2);stroke:var(--heme);stroke-width:4}
.bondl{stroke:var(--ink);stroke-width:3;fill:none}
.rack{fill:var(--surf2);stroke:var(--line);stroke-width:1.5}
.tag{fill:var(--surf);stroke:var(--line);stroke-width:1.5}

.modal{position:fixed;inset:0;background:rgba(18,12,26,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mcard{background:var(--surf);color:var(--ink);border-radius:20px;max-width:920px;width:100%;max-height:calc(100% - 40px);overflow:auto;padding:28px 32px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .3s ease-out}
.mcard .mk{margin:0;color:var(--accent);font-weight:700;font-size:.95rem}
.mcard h2{margin:2px 0 18px;font-size:1.8rem;line-height:1.15}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mcols section{background:var(--surf2);border-radius:14px;padding:16px 20px}
.mcols h3{margin:0 0 8px;font-size:1.15rem}
.mcols ol,.mcols ul{margin:0;padding-left:1.25em}
.mcols li{margin:7px 0;line-height:1.45}
.mcols .lead{margin:0 0 4px;color:var(--mute);font-size:.95rem}
.mfoot{display:flex;justify-content:flex-end;margin-top:20px}
.mfoot button{font-size:1.05rem;padding:10px 26px}
@media (max-width:760px){.mcols{grid-template-columns:1fr}.mcard{padding:20px}}
body.present .side{display:none}
body.present .app{grid-template-columns:1fr;max-width:none}
body.present .cap{font-size:1.5rem}
body.present .ask{font-size:1.25rem}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:16px 14px 10px}
  .side .lede{margin-bottom:10px}
  .nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:6px}
  .grp{display:none}
  .nav a{white-space:nowrap;border:1px solid var(--line)}
  main{padding:18px 14px 40px}
  .mhead h2{font-size:1.5rem}
  .panel{grid-template-columns:1fr}
  .ctrl{justify-content:flex-start}
  .count{text-align:left}
  .labgrid{grid-template-columns:1fr}
  .cap{font-size:1.08rem}
}

/* SVG */
.t{fill:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:15px}
.t-s{font-size:13px;fill:var(--mute)}
.t-s2{font-size:12.5px;fill:var(--mute)}
.t-n{font-size:13px;font-weight:700}
.t-b{font-weight:700}
.t-l{font-size:20px;font-weight:700}
.t-xl{font-size:32px;font-weight:700}
.t-e{font-size:11.5px;fill:var(--mute)}
.t-c{text-anchor:middle}
.warn-t{fill:var(--warn);font-weight:700}
.on-dark{fill:#fff}
.f-rbc{fill:var(--rbc)}.f-deoxy{fill:var(--deoxy)}.f-old{fill:var(--old)}.f-nuc{fill:var(--nuc)}
.f-stem{fill:var(--stem)}.f-baso{fill:var(--baso)}.f-baso2{fill:var(--baso2)}.f-poly{fill:var(--poly)}.f-orth{fill:var(--orth)}
.f-lumen{fill:var(--lumen)}.f-plasma{fill:var(--plasma)}.f-bili{fill:var(--bili)}.f-mac{fill:var(--mac)}
.f-epo{fill:var(--epo)}.f-brown{fill:var(--brown)}.f-alpha{fill:var(--alpha)}.f-beta{fill:var(--beta)}
.f-heme{fill:var(--heme)}.f-fe{fill:var(--ink)}.f-o2{fill:var(--rbc)}.f-mute{fill:var(--mute)}.f-surf2{fill:var(--surf2)}
.f-accent{fill:var(--accent)}.f-kid{fill:var(--kid)}.f-mucosa{fill:var(--mucosa)}.f-buffy{fill:var(--buffy)}.f-clay{fill:var(--clay)}
.rbc-c{fill:#fff;opacity:.28}
.rim{stroke:rgba(0,0,0,.18);stroke-width:1.2}
.sh,.box,.box-mac,.box-fec,.nb{filter:url(#sh)}
.chr{fill:#000;opacity:.22}
.fat{fill:var(--surf);stroke:var(--line);stroke-width:1.5}
.endo{fill:var(--nuc);opacity:.55}
.bob{transform-box:fill-box;transform-origin:center}
.on .bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(14px)}}
.oldc{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:4 3}
.wall{fill:none;stroke:var(--deoxy);stroke-width:7}
.macs{stroke:var(--nuc);stroke-width:2}
.burst{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.box{fill:var(--surf2);stroke:var(--line);stroke-width:1.5}
.box-mac{fill:var(--mac);stroke:var(--line);stroke-width:1.5}
.box-fec{fill:var(--feces);stroke:var(--line);stroke-width:1.5}
.arr{fill:none;stroke:var(--mute);stroke-width:2.5;marker-end:url(#ah)}
.arr.dash{stroke-dasharray:5 5}
.flow{stroke-dasharray:9 7;animation:dash 1.2s linear infinite}
.ves-a{fill:none;stroke:var(--rbc);stroke-width:20;opacity:.22;stroke-linecap:round}
.ves-v{fill:none;stroke:var(--deoxy);stroke-width:20;opacity:.22;stroke-linecap:round}
.alv{fill:var(--lumen);stroke:var(--rbc);stroke-width:1.5;opacity:.9}
.cellb{fill:var(--surf2);stroke:var(--line);stroke-width:1.5}
.glass{fill:none;stroke:var(--glass);stroke-width:3}
.tick{stroke:var(--mute);stroke-width:1.2}
.nucleolus{fill:var(--stem);opacity:.8}
.elb{fill:var(--surf);opacity:.92}
.node{cursor:pointer}
.node .nb{fill:var(--surf2);stroke:var(--line);stroke-width:2}
.node.k-iron .nb{stroke:var(--heme)} .node.k-low .nb{stroke:var(--baso)} .node.k-high .nb{stroke:var(--rbc)} .node.k-poly .nb{stroke:var(--epo)} .node.k-root .nb{stroke:var(--accent);stroke-width:2.5}
.node:hover .nb{fill:var(--surf)}
.node:focus{outline:none}
.node.sel .nb{fill:var(--surf);stroke:var(--accent);stroke-width:3.5}
.node.right .nb{stroke:var(--ok);stroke-width:5}
.node.wrong .nb{stroke:var(--warn);stroke-width:5}
.nq{opacity:0}
.quiz .node:not(.rev) .nl{opacity:0}
.quiz .node:not(.rev) .nq{opacity:1}

/* step engine */
[data-k]{opacity:0}
[data-k].on{opacity:1}
.now{animation:pop .7s ease-out both}
.dim{opacity:.18!important}
.hot>rect,.hot>ellipse,.hot>path,.hot>circle,rect.hot,path.hot,ellipse.hot{stroke:var(--hl)!important;stroke-width:4.5px!important}
.predict-hide .now.lab,.predict-hide .now .lab{opacity:0!important}
.sq,.stuck,.sq2,.drift,.driftL,.blink{transform-box:fill-box;transform-origin:center}
.now .sq{animation:sq 4.2s ease-in-out both}
.now .stuck{animation:stuck 3s ease-in both}
.now .sq2{animation:sq2 3.6s ease-in-out both}
.on .drift{animation:drift 1.8s ease-in infinite}
.on .driftL{animation:driftL 1.8s ease-in infinite}
.f-co2{fill:var(--mute)}
.on .blink{animation:blink 1.6s ease-in-out infinite}
.tubeG{transform-box:view-box;transform-origin:210px 230px}
.tubeG.spin{animation:spin 1.6s cubic-bezier(.55,0,.25,1)}
@keyframes pop{from{opacity:0}to{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-16}}
@keyframes sq{0%{transform:translateX(0)}30%{transform:translateX(150px)}42%{transform:translateX(215px) scale(1.55,.55)}70%{transform:translateX(400px) scale(1.55,.55)}82%{transform:translateX(470px)}100%{transform:translateX(560px)}}
@keyframes stuck{0%{transform:translateX(0)}70%{transform:translateX(150px)}80%{transform:translateX(160px) scale(1.06,.9)}88%{transform:translateX(152px)}100%{transform:translateX(158px) scale(1.06,.9)}}
@keyframes sq2{0%{transform:translateX(0)}35%{transform:translateX(42px)}48%{transform:translateX(70px) scale(1.7,.45)}62%{transform:translateX(92px) scale(1.7,.45)}74%{transform:translateX(112px)}100%{transform:translateX(150px)}}
@keyframes drift{0%{transform:translateX(-18px);opacity:0}30%{opacity:1}100%{transform:translateX(26px);opacity:0}}
@keyframes blink{50%{opacity:.25}}
@keyframes driftL{0%{transform:translateX(18px);opacity:0}30%{opacity:1}100%{transform:translateX(-26px);opacity:0}}
@keyframes spin{to{transform:rotate(1080deg)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .flow{stroke-dasharray:none}
}

/* ---------- white blood cell additions ---------- */
:root{--cyto:#F3DFE9;--ngran:#B98FC4;--eos:#E2572F;--basg:#383A96;--mono:#C3CDE8;--lymph:#A8C3EE;--bact:#3F8F4F;--paras:#B0703C;--hist:#D98E04;--tissue:#FCF3F5}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--cyto:#5B4556;--ngran:#C9A2D2;--eos:#F0703F;--basg:#8A8EF0;--mono:#4B5A7C;--lymph:#4D6896;--bact:#63C077;--paras:#C98B55;--hist:#F2B33D;--tissue:#241B22}
}
:root[data-theme="dark"]{--cyto:#5B4556;--ngran:#C9A2D2;--eos:#F0703F;--basg:#8A8EF0;--mono:#4B5A7C;--lymph:#4D6896;--bact:#63C077;--paras:#C98B55;--hist:#F2B33D;--tissue:#241B22}
.f-cyto{fill:var(--cyto)}.f-ngran{fill:var(--ngran)}.f-eos{fill:var(--eos)}.f-basg{fill:var(--basg)}.f-mono{fill:var(--mono)}.f-lymph{fill:var(--lymph)}
.f-bact{fill:var(--bact)}.f-paras{fill:var(--paras)}.f-hist{fill:var(--hist)}.f-tissue{fill:var(--tissue)}
.strand,.horse{stroke:var(--nuc);fill:none;stroke-linecap:round}
.worm{stroke:var(--paras);fill:none;stroke-width:10;stroke-linecap:round}
.gcell{fill:var(--surf);stroke:var(--mute);stroke-width:1.5}
.gnuc{fill:var(--mute);opacity:.3}
.deadc{fill:none;stroke:var(--mute);stroke-width:2;stroke-dasharray:4 4}
.ves-l{fill:none;stroke:var(--epo);stroke-width:20;opacity:.25;stroke-linecap:round}
.brk{fill:none;stroke:var(--mute);stroke-width:2}
.ring{fill:none;stroke:var(--hl);stroke-width:4}
.hc{fill:none}
.aby{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.field{fill:var(--lumen2);stroke:var(--glass);stroke-width:6}
.band{fill:var(--okbg);stroke:var(--ok);stroke-width:1.5}
.mig,.grow{transform-box:fill-box;transform-origin:center}
.now .mig{animation:dia 4.4s ease-in-out both}
.now .grow{animation:grow 2.8s ease-out both}
@keyframes mig{0%{transform:translate(0,0)}38%{transform:translate(var(--mx),0)}52%{transform:translate(var(--mx),calc(var(--dy)*.28)) scale(.7,1.22)}66%{transform:translate(var(--mx),calc(var(--dy)*.5))}100%{transform:translate(var(--dx),var(--dy))}}
@keyframes grow{from{transform:scale(.38)}to{transform:scale(1)}}
.dbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin:0 0 10px}
.dbtns button{border-radius:12px;padding:10px 12px;font-weight:700;border-width:1.5px}
.keyrow{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 4px}
.keyrow figure{margin:0;text-align:center;font-size:.92rem;color:var(--mute);max-width:120px}
.keyrow figure b{display:block;color:var(--ink)}
.keyrow svg{width:76px;height:76px;display:block;margin:0 auto 4px}
.rng{display:inline-block;position:relative;width:210px;height:12px;border-radius:6px;background:var(--surf);border:1px solid var(--line);vertical-align:middle;margin-right:8px}
.rng i{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--ok)}
.labt td.num,.labt th.num{text-align:right;font-variant-numeric:tabular-nums}

.labgrid>*{min-width:0}
#dTab{min-width:0;width:100%;max-width:520px}
.labt td.num{white-space:nowrap}

.endc{fill:var(--deoxy)}
.chd{fill:var(--mute);opacity:.55}.chl{stroke:var(--mute);stroke-width:1;opacity:.3}
@keyframes dia{0%{transform:translate(0,0)}30%,38%{transform:translate(var(--gx),var(--gy0))}48%{transform:translate(var(--gx),var(--gy1)) scale(.32,1.25)}58%{transform:translate(var(--gx),var(--gy2)) scale(1)}100%{transform:translate(var(--dx),var(--dy))}}
.thru,.slide{transform-box:fill-box;transform-origin:center}
.now .slide{animation:slide 1.8s ease-in-out both}
@keyframes slide{from{transform:translate(var(--sx),var(--sy))}}
.now .thru{animation:thru 3s ease-in-out both}
@keyframes thru{0%,15%{transform:translate(0,0)}50%{transform:translate(0,var(--gy1)) scale(.32,1.3)}80%,100%{transform:translate(0,var(--gy2)) scale(1)}}
.on .thru{transform:translate(0,var(--gy2))}

.f-skin{fill:#F2C6B4}.skc{fill:#F7D6C8;stroke:#E0A994;stroke-width:1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .f-skin{fill:#6E4A40}:root:not([data-theme="light"]) .skc{fill:#80584C;stroke:#9C6E60}}
:root[data-theme="dark"] .f-skin{fill:#6E4A40}:root[data-theme="dark"] .skc{fill:#80584C;stroke:#9C6E60}
.burst{fill:var(--warn)}
.box.trig{stroke:var(--accent);stroke-width:2.5}.box.histb{stroke:var(--hist);stroke-width:2.5}.box.sysb{stroke:var(--warn);stroke-width:2.5}
.box.ring{stroke:var(--hl);stroke-width:3}

</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>White blood cells</h1>
    <p class="lede">Interactive class set: blood and its functions</p>
    <nav class="nav" id="nav" aria-label="Modules"></nav>
  </aside>
  <main>
    <div class="mhead">
      <div>
        <h2 id="mt"></h2>
        <button id="bTest" class="primary" style="margin-top:12px">Test yourself</button>
        <p class="ref" id="mref" hidden></p>
      </div>
      <div class="row"><button id="bIntro" title="Show what to do and the learning outcomes">Instructions</button><button id="bPresent" aria-pressed="false" title="Hide the module list for projection (Esc to exit)">Present</button></div>
    </div>
    <div class="scen" id="scen"></div>
    <div class="stage" id="stage"></div>
    <div class="panel" id="panel">
      <div id="cap" aria-live="polite"></div>
      <div class="ctrl" id="ctrl">
        <label class="toggle" title="Hide labels and the explanation until you press Next, so the class can guess first"><input type="checkbox" id="pred"> Predict mode</label>
        <span class="count stepbtn" id="count"></span>
        <button id="bBack" class="stepbtn">Back</button>
        <button id="bPlay" class="stepbtn">Play</button>
        <button id="bNext" class="primary stepbtn">Next</button>
      </div>
    </div>
    <div class="extra" id="extra"></div>
    <footer style="margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:.95rem">Created By: <b style="color:var(--ink)">Dr. Khalid Abdul Majeed</b>, Department of Physiology, UVAS</footer>
  </main>
</div>
<div class="modal" id="intro" hidden role="dialog" aria-modal="true" aria-labelledby="introT">
  <div class="mcard">
    <p class="mk" id="introN"></p>
    <h2 id="introT"></h2>
    <div class="mcols">
      <section><h3>What to do</h3><ol id="introDo"></ol></section>
      <section><h3>Intended learning outcomes</h3><p class="lead">By the end, students should be able to:</p><ul id="introLo"></ul></section>
    </div>
    <div class="mfoot"><button id="introGo" class="primary">Start</button></div>
  </div>
</div>
<div class="modal" id="quiz" hidden role="dialog" aria-modal="true" aria-labelledby="qT">
  <div class="mcard">
    <div class="row" style="justify-content:space-between"><p class="mk" id="qProg"></p><button id="qClose">Close</button></div>
    <h2 id="qT"></h2>
    <div id="qBody"></div>
    <div class="mfoot"><button id="qNext" class="primary">Next question</button></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const CAP=s=>String(s).replace(/^([a-z])/,m=>m.toUpperCase());
const T=(x,y,s,c='',a='')=>`<text x="${x}" y="${y}" class="t ${c}" ${a}>${/nocap/.test(c)?s:CAP(s)}</text>`;
const R=(cx,cy,r,f='f-rbc',x='')=>`<g class="sh"><circle cx="${cx}" cy="${cy}" r="${r}" class="${f} rim ${x}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#rbcS)" pointer-events="none"/></g>`;
const O=(cx,cy,r)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#cellS)" pointer-events="none"/>`;
const CELL=(cx,cy,r,f,nr,nx=0,ny=0)=>`<g class="sh"><circle cx="${cx}" cy="${cy}" r="${r}" class="${f} rim"/>${O(cx,cy,r)}</g>`+(nr?`<circle cx="${cx+nx}" cy="${cy+ny}" r="${nr}" class="f-nuc"/>${O(cx+nx,cy+ny,nr)}${GR(cx+nx,cy+ny,Math.max(3,Math.round(nr/3)),nr*.85,'chr')}`:'');
const K=(k,inner,attr='')=>`<g data-k="${k}" ${attr}>${inner}</g>`;
const DEFS=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-mute"/></marker>
<linearGradient id="hbg" x1="0" x2="1"><stop offset="0" style="stop-color:var(--baso)"/><stop offset=".45" style="stop-color:var(--poly)"/><stop offset="1" style="stop-color:var(--rbc)"/></linearGradient>
<radialGradient id="rbcS" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset=".38" stop-color="#fff" stop-opacity=".16"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/><stop offset=".86" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient>
<radialGradient id="cellS" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/></radialGradient>
<linearGradient id="lumG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--lumen)"/><stop offset=".5" style="stop-color:var(--lumen2)"/><stop offset="1" style="stop-color:var(--lumen)"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".18"/></filter></defs>`;
const SV=(inner,vb='0 0 800 440',label='Diagram')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">${DEFS}${inner}</svg>`;
const BX=o=>`<g ${o.k?`data-k="${o.k}"`:''} ${o.tk?`data-t="${o.tk}"`:''}><rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="10" class="${o.cls||'box'}"/>${T(o.x+o.w/2,o.y+(o.s?o.h/2-3:o.h/2+5),o.t,'t-c t-b')}${o.s?T(o.x+o.w/2,o.y+o.h/2+15,o.s,'t-c t-s',o.sk?`data-t="${o.sk}"`:''):''}${o.extra||''}</g>`;
const A=(d,attr='',cls='arr flow')=>`<path d="${d}" class="${cls}" ${attr}/>`;

const GR=(cx,cy,n,r,cls='f-nuc')=>Array.from({length:n},(_,j)=>{const a=j*2.4,d=r*(.25+.6*((j*37)%10)/10);return `<circle cx="${(cx+Math.cos(a)*d).toFixed(1)}" cy="${(cy+Math.sin(a)*d).toFixed(1)}" r="2.3" class="${cls}"/>`}).join('');

/* ---------- leukocyte drawings (all drawn around 0,0) ---------- */
const f1=n=>(+n).toFixed(1);
const SUN=(n,RR,r,cls)=>Array.from({length:n},(_,j)=>{const a=j*2.39996,d=RR*Math.sqrt((j+.6)/n);return `<circle cx="${f1(Math.cos(a)*d)}" cy="${f1(Math.sin(a)*d)}" r="${f1(r)}" class="${cls}"/>`}).join('');
const BODY=(r,f)=>`<g class="sh"><circle r="${r}" class="${f} rim"/></g>`;
const NEU=(r,n=4)=>{const P=[];for(let i=0;i<n;i++){const t=(160+i*220/(n-1))*Math.PI/180,d=(.45+(i%2?.03:-.02))*r;P.push([d*Math.cos(t),d*Math.sin(t)+.04*r]);}
  const lr=(n<=3?.27:n===4?.24:.2)*r;
  return `${BODY(r,'f-cyto')}${SUN(22,r*.84,r*.045,'f-ngran')}<path d="M${P.map(p=>f1(p[0])+' '+f1(p[1])).join(' L')}" class="strand" stroke-width="${f1(r*.1)}"/>${P.map((p,i)=>`<ellipse cx="${f1(p[0])}" cy="${f1(p[1])}" rx="${f1(lr)}" ry="${f1(lr*(i%2?.82:.95))}" class="f-nuc"/>`).join('')}${O(0,0,r)}`};
const EOS=r=>`${BODY(r,'f-cyto')}${SUN(20,r*.82,r*.105,'f-eos')}<path d="M${f1(-.3*r)} ${f1(-.05*r)} H${f1(.3*r)}" class="strand" stroke-width="${f1(r*.1)}"/><ellipse cx="${f1(-.33*r)}" cy="${f1(-.05*r)}" rx="${f1(.26*r)}" ry="${f1(.33*r)}" class="f-nuc"/><ellipse cx="${f1(.33*r)}" cy="${f1(-.05*r)}" rx="${f1(.26*r)}" ry="${f1(.33*r)}" class="f-nuc"/>${O(0,0,r)}`;
const BAS=r=>`${BODY(r,'f-cyto')}<ellipse cx="${f1(-.25*r)}" cy="${f1(-.08*r)}" rx="${f1(.3*r)}" ry="${f1(.34*r)}" class="f-nuc" opacity=".7"/><ellipse cx="${f1(.27*r)}" cy="${f1(.06*r)}" rx="${f1(.3*r)}" ry="${f1(.32*r)}" class="f-nuc" opacity=".7"/>${SUN(17,r*.8,r*.125,'f-basg')}${O(0,0,r)}`;
const BEAN=[['M',-.52,.02],['C',-.52,-.42,-.12,-.56,.2,-.5],['C',.5,-.44,.64,-.14,.56,.12],['C',.5,.34,.3,.42,.18,.3],['C',.1,.2,0,.12,-.12,.2],['C',-.26,.3,-.52,.36,-.52,.02]];
const MONO=r=>`${BODY(r,'f-mono')}<path d="${BEAN.map(c=>c[0]+c.slice(1).map(v=>f1(v*r*1.15)).join(' ')).join(' ')}Z" class="f-nuc"/>${O(0,0,r)}`;
const LYM=r=>`${BODY(r,'f-lymph')}<circle cx="${f1(.05*r)}" cy="${f1(.04*r)}" r="${f1(.74*r)}" class="f-nuc"/>${O(0,0,r)}`;
const MACP=[['M',-1,-.1],['C',-1.05,-.6,-.5,-.95,0,-.9],['C',.3,-1.15,.8,-.9,.85,-.5],['C',1.2,-.3,1.1,.3,.8,.5],['C',.7,.95,.2,1.05,-.2,.85],['C',-.6,1.1,-1.1,.6,-1,-.1]];
const MAC=r=>{const d=MACP.map(c=>c[0]+c.slice(1).map(v=>f1(v*r)).join(' ')).join(' ')+'Z';return `<path d="${d}" class="f-mac macs sh"/><path d="${d}" fill="url(#cellS)" pointer-events="none"/><ellipse cx="${f1(-.2*r)}" cy="${f1(.08*r)}" rx="${f1(.36*r)}" ry="${f1(.27*r)}" class="f-nuc" opacity=".75"/>`};
const MAST=r=>`<g class="sh"><ellipse rx="${r}" ry="${f1(.78*r)}" class="f-cyto rim"/></g><g transform="scale(1 .78)">${SUN(18,r*.82,r*.11,'f-basg')}</g><circle r="${f1(.27*r)}" class="f-nuc"/>`;
const GEN=r=>`<circle r="${r}" class="gcell"/><circle cx="${f1(.1*r)}" cy="${f1(-.05*r)}" r="${f1(.42*r)}" class="gnuc"/>`;
const W=(fn,x,y,r,...a)=>`<g transform="translate(${x} ${y})">${fn(r,...a)}</g>`;
const BAC=(x,y,rot=0)=>`<rect x="${x-8}" y="${y-3.5}" width="16" height="7" rx="3.5" class="f-bact" transform="rotate(${rot} ${x} ${y})"/>`;
const HC=(k,x,y,r,inner)=>`<g data-t="${k}"><circle cx="${x}" cy="${y}" r="${r}" class="hc"/>${inner}</g>`;
const MIG=(k,x,y,dx,dy,inner,gx,r=28,wy=180)=>`<g data-k="${k}" transform="translate(${x} ${y})"><g class="mig" style="--gx:${gx-x}px;--gy0:${wy-r-4-y}px;--gy1:${wy-y}px;--gy2:${wy+r+6-y}px;--dx:${dx}px;--dy:${dy}px">${inner}</g></g>`;
/* endothelial cells along a vessel wall; gaps = [[x,width]] are widened spaces between cells */
const ENDO=(y,gaps=[])=>{let cuts=[];for(let x=40;x<800;x+=64)if(!gaps.some(g=>Math.abs(g[0]-x)<36))cuts.push([x,3]);cuts=cuts.concat(gaps).sort((a,b)=>a[0]-b[0]);
  let s='',x0=-10;cuts.concat([[815,0]]).forEach(([c,w])=>{const x1=c-w/2;if(x1-x0>4)s+=`<rect x="${f1(x0)}" y="${y-5}" width="${f1(x1-x0)}" height="10" rx="5" class="endc"/><ellipse cx="${f1((x0+x1)/2)}" cy="${y}" rx="8" ry="2.4" class="endo"/>`;x0=c+w/2;});return s;};
/* chemotactic substance: densest at the source, thinning with distance */
const CHEMO=(cx,cy,RR,ymin,lines=false,ymax=436)=>{let s='';
  if(lines)for(let i=0;i<10;i++){const a=i*Math.PI/5+.2,sn=Math.sin(a);let t=1;if(cy+sn*RR<ymin)t=(ymin-cy)/(sn*RR);s+=`<path d="M${f1(cx)} ${f1(cy)} L${f1(cx+Math.cos(a)*RR*t)} ${f1(cy+sn*RR*t)}" class="chl"/>`;}
  for(let j=0;j<240;j++){const a=j*2.39996,d=RR*Math.pow((j+.5)/240,1.5),x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d;if(y<ymin||x<4||x>796||y>ymax)continue;s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="1.8" class="chd"/>`;}
  return s;};
const DOTS=(pts,cls,r=4.5)=>pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${r}" class="${cls} blink" style="animation-delay:${(i*.17).toFixed(2)}s"/>`).join('');
const VESSEL=(y1=80,y2=180,split=false,gaps=[])=>`<rect x="0" y="0" width="800" height="440" class="f-tissue"/>${split?`<rect x="0" y="${y2}" width="222" height="${440-y2}" class="f-surf2"/><path d="M222 ${y2} V440" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 6"/>`:''}<rect x="0" y="${y1}" width="800" height="${y2-y1}" fill="url(#lumG)"/><path d="M0 ${y1} H800" class="wall"/>${[40,170,310,450,590,730].map(x=>`<ellipse cx="${x}" cy="${y1}" rx="9" ry="3.2" class="endo"/>`).join('')}${ENDO(y2,gaps)}${[[90,120],[140,156],[230,105],[390,154],[520,106],[612,152],[700,112],[770,150]].map(([x,y])=>R(x,y,11)).join('')}${T(12,104,'Blood','t-s')}${split?T(12,206,'Bone marrow','t-s')+T(238,206,'Tissue','t-s'):T(12,206,'Tissue','t-s')}`;
const GS=(inner,label,gaps=[])=>SV(VESSEL(80,180,false,gaps)+inner,'0 0 800 440',label);
const GSM=(inner,label,gaps=[])=>SV(VESSEL(80,180,true,gaps)+inner,'0 0 800 440',label);

const HEX=(x,y)=>{const p=[];for(let i=0;i<6;i++){const a=i*Math.PI/3;p.push(f1(x+13*Math.cos(a))+','+f1(y+13*Math.sin(a)));}let s='';for(let i=0;i<6;i++){const a=i*Math.PI/3+Math.PI/6;s+=`<path d="M${f1(x+12*Math.cos(a))} ${f1(y+12*Math.sin(a))} L${f1(x+19*Math.cos(a))} ${f1(y+19*Math.sin(a))}" stroke="var(--baso)" stroke-width="2.5" stroke-linecap="round"/>`;}return s+`<polygon points="${p.join(' ')}" class="f-baso"/>`};
/* ---------- 1. What makes a leukocyte different ---------- */
const M1A=GSM(`
${K('chem',CHEMO(660,340,200,190))}
${K('lr',T(580,58,'Erythrocytes work inside the blood vessels','t-c t-b'))}
${K('w1',W(GEN,300,130,28))}
${K('lw',`${T(300,44,'Leukocyte','t-c t-b')}${T(300,62,'no pigmented molecules','t-c t-s')}`)}
${K('ratio',`<rect x="262" y="226" width="300" height="54" rx="10" class="box"/>${T(412,249,'1 leukocyte','t-c t-b')}${T(412,268,'for every 500 to 1000 erythrocytes','t-c t-s nocap')}`)}
${K('mar',`<rect x="20" y="290" width="190" height="60" rx="10" class="box"/>${T(115,316,'Leukocytes','t-c t-b')}${T(115,335,'are formed here','t-c t-s')}<path d="M115 290 V190" class="arr"/>`)}
${K('site',T(660,232,'Where they are needed','t-c t-b'))}
${K('bugs',[[640,318,20],[668,340,-30],[696,314,60],[654,366,0],[708,358,40],[622,346,80]].map(a=>BAC(...a)).join('')+T(640,424,'Bacteria, viruses, fungi or parasites','t-c t-s'))}
${MIG('wm',300,130,290,200,GEN(28),360)}
${K('wend',W(GEN,590,330,28))}
${K('w2',W(GEN,720,300,24))}${K('w3',W(GEN,745,372,24))}
`,'Leukocytes travel in the blood to the tissues',[[360,14]]);

const M1B=(()=>{let mg='',bg='';
  for(let i=0;i<100;i++){const x=62+(i%10)*24,y=80+Math.floor(i/10)*21;mg+=i%4===3?`<circle cx="${x}" cy="${y}" r="8" class="f-rbc"/>`:`<circle cx="${x}" cy="${y}" r="8" class="f-cyto" stroke="var(--nuc)" stroke-width="1"/><circle cx="${x}" cy="${y}" r="3.5" class="f-nuc"/>`;}
  for(let i=0;i<500;i++){const x=493+(i%25)*11,y=76+Math.floor(i/25)*10.5;bg+=i===213?`<circle cx="${x}" cy="${y}" r="4.5" class="f-surf" stroke="var(--nuc)" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="10" class="ring"/>`:`<circle cx="${x}" cy="${y}" r="4" class="f-rbc"/>`;}
  const BR=(y,lab,k)=>`${T(30,y+12,lab,'t-b')}<rect x="270" y="${y}" width="500" height="14" rx="7" class="f-surf2" stroke="var(--line)"/><rect x="270" y="${y}" width="45" height="14" rx="7" class="f-nuc" data-t="${k}" data-max="500"/>`;
  return SV(`
<rect x="30" y="30" width="290" height="268" rx="14" class="box"/>${T(46,56,'Bone marrow','t-b')}
<rect x="480" y="30" width="290" height="268" rx="14" class="box"/>${T(496,56,'Blood','t-b')}
${K('mg',mg+T(175,318,'About 75%: white blood cells or their precursors','t-c t-s'))}
${K('bg',bg+T(625,318,'Here: 1 leukocyte among 500 cells','t-c t-s'))}
${K('flowA',`<path d="M328 164 H472" class="arr flow" style="stroke:var(--hl)"/>${T(400,150,'released','t-c t-s')}`)}
${K('inf',T(400,120,'Serious infection','t-c warn-t'))}
${K('pen',`${T(400,112,'Bone marrow','t-c warn-t')}${T(400,130,'activity reduced','t-c warn-t nocap')}`)}
${K('bars',BR(345,'Leukocytes in the blood','bBl')+BR(385,'Leukocytes stored in marrow','bSt')+T(770,424,'Bar lengths are illustrative','t-s','text-anchor="end"'))}
`,'0 0 800 440','Leukocytes in the bone marrow and in the blood');})();

/* ---------- 2. The five types ---------- */
const TX=[200,330,460,600,720],TR=[46,46,42,54,32],TF=[NEU,EOS,BAS,MONO,LYM],TN=['Neutrophil','Eosinophil','Basophil','Monocyte','Lymphocyte'],TS=['multi-lobed nucleus','orange-red granules','dark blue granules','kidney-shaped nucleus','non-granular'];
const FN=(x,a,b)=>`<path d="M${x} 302 V316" class="brk"/>${T(x,336,a,'t-c t-b')}${T(x,354,b,'t-c t-s nocap')}`;
const M2=SV(`
${R(70,190,22)}${T(70,270,'Erythrocyte','t-c t-n')}${T(70,288,'for size','t-c t-s')}
${K('ghost',TX.map((x,i)=>W(GEN,x,190,TR[i])).join(''))}

/* ---------- concept map builder ---------- */
function mapSVG(nodes,edges,H=440){
  const N={};
  nodes.forEach(n=>{const [ti,...su]=n.l.split('\n');n.L=[...ti.split('|').map(s=>({s,b:1})),...su.map(s=>({s,b:0}))];n.name=n.L.map(o=>o.s).join(' ');n.w=Math.max(...n.L.map(o=>o.s.length*(o.b?8.4:6.8)))+28;n.h=n.L.length*18+18;N[n.id]=n;});
  const clip=(n,dx,dy)=>{const tx=dx?(n.w/2+3)/Math.abs(dx):1e9,ty=dy?(n.h/2+3)/Math.abs(dy):1e9,t=Math.min(tx,ty);return[n.x+dx*t,n.y+dy*t]};
  let es='',ls='';
  edges.forEach(([a,b,lab,dash,fr=.5])=>{const P=N[a],Q=N[b];let dx=Q.x-P.x,dy=Q.y-P.y;const d=Math.hypot(dx,dy);dx/=d;dy/=d;
    const [x1,y1]=clip(P,dx,dy),[x2,y2]=clip(Q,-dx,-dy);
    es+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}" class="arr ${dash?'dash':''}" data-t="e_${a}_${b}"/>`;
    if(lab){const mx=x1+(x2-x1)*fr,my=y1+(y2-y1)*fr,w=lab.length*6.3+14;ls+=`<g><rect x="${(mx-w/2).toFixed(1)}" y="${(my-10).toFixed(1)}" width="${w.toFixed(1)}" height="20" rx="6" class="elb"/>${T(mx.toFixed(1),(my+4).toFixed(1),lab,'t-c t-e')}</g>`}});
  const ns=nodes.map(n=>{const y0=n.y-(n.L.length-1)*9;return `<g class="node ${n.c||''}" data-node="${n.id}" data-t="n_${n.id}" tabindex="0" role="button" aria-label="${n.name}"><rect x="${(n.x-n.w/2).toFixed(1)}" y="${(n.y-n.h/2).toFixed(1)}" width="${n.w.toFixed(1)}" height="${n.h}" rx="12" class="nb"/><g class="nl">${n.L.map((o,j)=>T(n.x,(y0+j*18+5).toFixed(1),o.s,'t-c '+(o.b?'t-b':'t-s2')+(o.b&&j?' nocap':''))).join('')}</g>${T(n.x,n.y+7,'?','t-c t-l nq')}</g>`}).join('');
  return SV(es+ls+ns,`0 0 800 ${H}`,'Concept map');
}

 {t:'A dog has a total leukocyte count far below the normal range. What is this called?',a:'pen',not:['sup','nDown'],w:'An abnormally low number of leukocytes is called leukopenia.'},

 {t:'A horse is having an allergic reaction. Which change in the differential count fits?',a:'eUp',w:'The number of eosinophils increases during allergic reactions.'},

const gameX=G=>MAPX+`<div class="case"><div class="row"><button id="gNew" class="primary">${G.btn}</button><span class="note">${G.hint}</span></div><p class="ct" id="gText"></p><p class="fb" id="gFb" aria-live="polite"></p></div>`;
function gameInit(G){mapInit();G.cur=null;$('#gNew').onclick=()=>{G.i=(G.i+1)%G.items.length;G.cur=G.items[G.i];$('#gText').textContent=`${G.i+1} of ${G.items.length}: ${G.cur.t}`;$('#gFb').textContent='';$('#gFb').className='fb';document.querySelectorAll('.node.right,.node.wrong').forEach(n=>n.classList.remove('right','wrong'));};}
function gameNode(G,id,g,root){if(!G.cur)return false;root.querySelectorAll('.node.wrong').forEach(n=>n.classList.remove('wrong'));const fb=$('#gFb');
  if(id===G.cur.a){g.classList.add('right');fb.className='fb good';fb.textContent='Correct. '+G.cur.w;G.cur=null;}
  else{g.classList.add('wrong');fb.className='fb bad';fb.textContent='Not this one. Try again.';}
  return true;}
const mapMod=(o,nodes,edges,G,cap)=>({...o,g:'Concept maps',nodes,game:G,svg:()=>mapSVG(nodes,edges),extra:gameX(G),init(){gameInit(G);},onNode(id,g,root){return gameNode(G,id,g,root);},after(root){mapClicks(this,root);},scen:{explore:{label:'Explore',steps:[{cap}]}}});

const MODS=[
{id:'meet',g:'Animations',title:'What makes a leukocyte different',scen:{
 vs:{label:'White cells and red cells',svg:M1A,steps:[
  {on:['lr'],cap:'Erythrocytes perform their functions inside the blood vessels.'},
  {on:['w1','lw'],cap:'Leukocytes have no pigmented molecules such as hemoglobin. That is why they are called white blood cells (leukos = white).',q:'Why are leukocytes called white blood cells?',o:['They lack pigments such as hemoglobin','They store a pale pigment in their vesicles','They are made in the yellow bone marrow','They have no nucleus or organelles'],a:'Leukos means white. Leukocytes have no hemoglobin or other pigment.'},
  {on:['ratio'],cap:'In the blood, the number of white blood cells is only a fraction, 1/500 to 1/1000, of the number of red blood cells.',q:'How does the number of white blood cells in the blood compare with the number of red blood cells?',o:['About 1/500 to 1/1000 of the red cell number','About one tenth to one fifth of the red cell number','About the same as the red cell number','About ten times the red cell number'],a:'More than 90% of the blood cells are erythrocytes.'},
  {on:['mar','site'],cap:'Leukocytes use the blood only as a means of transport, from the sites where they are formed to the sites where they are needed.',q:'What do leukocytes use the blood for?',o:['Only as transport to where they are needed','As the place where they do all their work','As a store where they live for several years','As a supply of hemoglobin and oxygen'],a:'Erythrocytes perform their functions inside the blood vessels. Leukocytes do not.'},
  {on:['bugs'],cap:'They are needed at sites where bacteria, viruses, fungi or parasites have entered the body.'},
  {off:['w1','lw'],on:['wm','chem'],cap:'Large numbers of leukocytes are rapidly directed to sites of inflammation, where they can effectively combat the offending organisms. They squeeze through the spaces between the endothelial cells of the vessel wall (diapedesis) and move toward the source of a chemotactic substance (chemotaxis).',dur:5200},
  {off:['wm'],on:['wend','w2','w3'],cap:'The various types of leukocytes have different functions in the defense of the body. However, all types are essential.',q:'Which types of leukocytes are essential for the defense of the body?',o:['All five types','Only the neutrophils','Only the lymphocytes','Only the granulocytes'],a:'The various types have different functions in the defense of the body, and all of them are essential.'}]},
 store:{label:'The bone marrow reserve',svg:M1B,steps:[
  {on:['mg','bg'],cap:'In the blood, leukocytes are only 1/500 to 1/1000 as numerous as erythrocytes. In the bone marrow, on the other hand, about 75% of the cells are white blood cells or their precursors. Several factors explain this.',q:'What share of the cells in the bone marrow are white blood cells or their precursors?',o:['About 75%','About 1%','About 10%','About 25%'],a:'In the blood, by contrast, leukocytes are only 1/500 to 1/1000 of the number of red blood cells.'},
  {cap:'First factor: the lifespan of the leukocytes is much shorter than the lifespan of the erythrocytes.'},
  {on:['bars'],w:{bBl:.09,bSt:.9},cap:'Second factor: the bone marrow normally stores about ten times more leukocytes than the total number in the blood. Mature erythrocytes, in contrast, are transferred to the blood as soon as they are formed.',q:'How large is the store of leukocytes in the bone marrow?',o:['About ten times the total number of leukocytes in the blood','About the same as the number in the blood','About one tenth of the number in the blood','There is no store: leukocytes enter the blood as soon as they are formed'],a:'Mature erythrocytes, in contrast, are transferred to the blood as soon as they are formed.'},
  {cap:'Third factor: mature erythrocytes are present only in the blood, whereas mature leukocytes are present nearly everywhere in the body.'},
  {on:['inf','flowA'],w:{bBl:.32,bSt:.55},cap:'When the body is threatened by a serious infection, vast numbers of stored leukocytes are rapidly released from the bone marrow, and the number of leukocytes in the blood rises.',q:'What happens to the stored leukocytes when the body is threatened by a serious infection?',o:['Vast numbers are rapidly released from the bone marrow','They are destroyed in the spleen','They turn into erythrocytes','They stay in the bone marrow until the infection is over'],a:'The number of leukocytes in the blood rises.'},
  {cap:'As long as the infection continues, the production rate of leukocytes is kept high, which maintains the elevated number in the blood. An increased number of leukocytes in the blood is called leukocytosis.',q:'What is an increased number of leukocytes in the blood called?',o:['Leukocytosis','Leukopenia','Polycythemia','Anemia'],a:'An abnormally low number is called leukopenia.'},
  {off:['inf','flowA'],on:['pen'],w:{bBl:.02,bSt:.05},cap:'An abnormally low number of white blood cells is called leukopenia. It can arise from drugs that reduce the activity of the bone marrow, such as chemotherapeutic drugs, from radiation treatment, or, occasionally, from nuclear plant accidents.',q:'What can cause leukopenia?',o:['Drugs or radiation that reduce bone marrow activity','A serious infection that empties the bone marrow store','Hard physical exercise that mobilizes the spleen','A fatty meal that activates lipoprotein lipase'],a:'Leukopenia is an abnormally low number of white blood cells.'},
  {cap:'If the entire production of leukocytes ceases, serious infections will arise, and death will ensue, usually within a few days, if treatment is not initiated.',q:'What happens if the entire production of leukocytes ceases?',o:['Serious infections, and usually death within days','Nothing, as the marrow store lasts for several years','Erythrocytes take over the defense of the body','The animal becomes jaundiced within a few hours'],a:'All types of leukocytes are essential for the defense of the body.'}]}}},

{id:'types',g:'Animations',title:'The five types of leukocytes',svg:M2,scen:{main:{label:'The five types',steps:[
  {on:['ghost'],cap:'Leukocytes are larger than erythrocytes, and they have a nucleus and the usual cell organelles. Because they do not contain pigments, they must be stained with dyes before the various types can be distinguished from each other under the microscope.',q:'Why must leukocytes be stained before the types can be distinguished under the microscope?',o:['They do not contain pigments','They are too small to be seen','They have no nucleus','They are hidden inside the erythrocytes'],a:'Erythrocytes contain hemoglobin; leukocytes contain no pigments.'},
  {off:['ghost'],on:['c0','c1','c2','c3','c4'],cap:'After staining, five different types of leukocytes can be told apart. Leukocytes are classified by the shape of the nucleus, the numbers and types of vesicles, and the site of production.',q:'On what basis are leukocytes classified?',o:['Nucleus shape, vesicles, and site of production','Colour before staining, and hemoglobin content','Cell size, lifespan, and oxygen-carrying capacity','Number of nuclei, and speed in the blood'],a:'There are five different types of leukocytes.'},
  {on:['br1'],hot:['h0','h1','h2'],cap:'Three types have multi-lobed nuclei with varying shapes, so they are called polymorphonuclear leukocytes (polymorph = many shapes). They have many vesicles, which give the cytoplasm a granular appearance when the cells are stained, so they are also often called granulocytes.',q:'Why are polymorphonuclear leukocytes also called granulocytes?',o:['Their vesicles make stained cytoplasm look granular','Their nuclei break up into small granules with age','They are formed from granules in the plasma','They carry granules of hemoglobin to the tissues'],a:'Polymorph means many shapes: their nuclei are multi-lobed with varying shapes.'},
  {on:['lab0'],hot:['h0'],cap:'Neutrophilic granulocyte (neutrophil). Mature neutrophils have an irregular, multi-lobed nucleus. In the dog (70%) and the horse (60%), neutrophils are more than half of the leukocytes. In the cow, pig and sheep, lymphocytes are the largest group.',q:'Which leukocyte makes up more than half of the leukocytes in the dog and the horse?',o:['Neutrophil','Lymphocyte','Eosinophil','Monocyte'],a:'In the cow, pig and sheep, lymphocytes are the largest group instead.'},
  {on:['lab1'],hot:['h1'],cap:'Eosinophilic granulocyte (eosinophil). In the stained cells drawn here, its vesicles appear orange-red.'},
  {on:['lab2'],hot:['h2'],cap:'Basophilic granulocyte (basophil). In the stained cells drawn here, its vesicles appear dark blue. The different granulocytes are easily identified by microscopy by the colour of their vesicles after staining.',q:'How are the three types of granulocytes identified under the microscope?',o:['By the colour of their vesicles after staining','By their size alone, measured under the microscope','By the number of separate nuclei in each cell','By the amount of hemoglobin in the cytoplasm'],a:'The three types are neutrophilic, eosinophilic and basophilic granulocytes.'},
  {on:['br2'],hot:['h3','h4'],cap:'The vesicles of the other two leukocyte types do not stain when treated with standard dyes. These cells are often called non-granular leukocytes.',q:'Which two types are the non-granular leukocytes?',o:['Monocytes and lymphocytes','Neutrophils and eosinophils','Basophils and monocytes','Eosinophils and lymphocytes'],a:'Their vesicles do not stain when treated with standard dyes.'},
  {on:['lab3'],hot:['h3'],cap:'Monocyte. Monocytes have a kidney-shaped nucleus and are larger than lymphocytes.',q:'Which leukocyte has a kidney-shaped nucleus?',o:['Monocyte','Lymphocyte','Neutrophil','Basophil'],a:'Monocytes are also larger than lymphocytes.'},
  {on:['lab4'],hot:['h4'],cap:'Lymphocyte: the other non-granular leukocyte.'},
  {on:['ves'],cap:'Certain leukocyte types have particularly many membrane vesicles in the cytoplasm. These vesicles are either lysosomes, or vesicles that transfer their contents to the adjacent tissue fluid by exocytosis.'},
  {on:['fnN'],cap:'Neutrophils, and monocytes once they have become macrophages in the tissues, protect the body by engulfing invading organisms, breaking them down, and digesting their cellular material. This is called phagocytosis.',q:'What is phagocytosis?',o:['Engulfing, breaking down and digesting invaders','Producing antibodies against specific invaders','Releasing toxic substances onto parasites','Releasing histamine and heparin into tissues'],a:'Neutrophils and macrophages work in this way. Eosinophils have negligible ability to phagocytize bacteria.'},
  {on:['fnE'],cap:'The other two granulocytes work differently. Eosinophils have negligible ability to phagocytize bacteria; they kill parasites by releasing toxic substances from their vesicles. Basophils have vesicles that contain histamine and heparin; histamine released from basophils and mast cells is largely responsible for most allergic reactions.'},
  {on:['fnL'],cap:'Lymphocytes, on the other hand, seek out and combat microorganisms in a more elaborate manner, partly by producing antibodies against the intruders.',q:'Which leukocytes combat microorganisms partly by producing antibodies?',o:['Lymphocytes','Neutrophils','Eosinophils','Monocytes'],a:'Neutrophils and macrophages use phagocytosis instead.'}]}}},

{id:'tree',g:'Animations',title:'Production of leukocytes',scen:{
 tree:{label:'The family tree',svg:M3A,steps:[
  {on:['stem'],cap:'All blood cells originate from a single, undifferentiated, pluripotent stem cell type in the bone marrow (pluripotent = having many potentials).',q:'From which cell do all blood cells originate?',o:['A single pluripotent stem cell type','Mature lymphocytes in the lymph nodes','Megakaryocytes in the bone marrow','Macrophages attached to liver capillaries'],a:'Pluripotent means having many potentials.'},
  {on:['lymS','myeS'],cap:'The undifferentiated stem cells give rise to two slightly more differentiated cell types: lymphoid stem cells and myeloid stem cells.'},
  {on:['T','B'],cap:'Lymphoid stem cells produce lymphocytes.',q:'Which cells do lymphoid stem cells produce?',o:['Lymphocytes','Neutrophils','Erythrocytes','Blood platelets'],a:'All the other blood cells come from myeloid stem cells.'},
  {on:['mo','ne','eo','ba'],cap:'Myeloid stem cells give rise to the other types of leukocytes: the monocytes and the three types of granulocytes.'},
  {on:['rb','mk','pl'],cap:'Myeloid stem cells also give rise to the erythrocytes and the blood platelets. Blood platelets (thrombocytes) are cellular fragments of megakaryocytes, a cell type that is found only in the bone marrow.',q:'Which cells do myeloid stem cells give rise to?',o:['Other leukocytes, erythrocytes and platelets','Lymphocytes only, in the lymphoid tissue','Erythrocytes only, in the red bone marrow','Antibodies, cytokines and erythropoietin'],a:'Lymphoid stem cells produce the lymphocytes.'},
  {hot:['hmo','hne','heo','hba'],cap:'Granulocytes and monocytes are formed only in the bone marrow.',q:'Where are granulocytes and monocytes formed?',o:['Only in the bone marrow','In the lymph nodes','In the spleen and the thymus','In the liver'],a:'Mature lymphocytes, in contrast, arise in lymphoid tissue.'},
  {on:['lt'],hot:['hT','hB'],cap:'Most immature lymphocytes, on the other hand, leave the bone marrow at the end of the fetal stage and during the early postnatal period. They migrate to lymphoid tissue in the lymph nodes, spleen, tonsils, thymus, intestines and other organs, where they give rise to mature lymphocytes through further mitosis and differentiation. From there, lymphocytes enter the blood.',q:'Where do mature lymphocytes arise?',o:['In lymphoid tissue, such as the lymph nodes','Only in the red bone marrow of flat bones','In the circulating blood, during a few hours','In the kidneys, under the control of cytokines'],a:'Most immature lymphocytes leave the bone marrow at the end of the fetal stage and during the early postnatal period.'}]},
 cyto:{label:'Cytokines and infection',svg:M3B,steps:[
  {...BASE3,cap:'The production of immature leukocytes from stem cells, and their differentiation to mature cells, are complex processes regulated by the interaction of many cytokines. Cytokines are proteins or peptides that are produced by certain cells and affect the growth or activity of other cells.',q:'What are cytokines?',o:['Proteins or peptides that affect other cells','Vesicles that empty their contents by exocytosis','A type of lymphocyte found in lymphoid tissue','Fragments that bud off from megakaryocytes'],a:'The interaction of many cytokines regulates the production and differentiation of leukocytes.'},
  {w:{bInf:.9},set:{vInf:'present',status:'Infection starts'},hot:['nTop'],cap:'The process usually starts with an infection.'},
  {on:['cyt'],w:{bCyt:.9},set:{vCyt:'increased',status:'Cytokines produced'},hot:['nRight'],cap:'Cytokines produced by activated leukocytes, or by other cells in infected or injured tissue, regulate the production of immature leukocytes from stem cells.',q:'Which cells produce the cytokines that regulate the production of immature leukocytes?',o:['Activated leukocytes and cells in infected tissue','Erythrocytes passing through infected tissue','Blood platelets released from the spleen','Kidney cells responding to low oxygen delivery'],a:'These cytokines regulate the production of immature leukocytes from stem cells.'},
  {hot:['nBot'],set:{status:'Stem cells respond'},cap:'Other cytokines guide the differentiation of the new cells in the appropriate direction.'},
  {w:{bLeu:.92},set:{vLeu:'increased',status:'More defense cells'},hot:['nLeft'],cap:'The process continues with increased mobilization and production of defense cells. Leukocytes are produced at varying rates, depending on the defense needs of the body.'},
  {cap:'The number of granulocytes in the blood is regulated in two different ways: regulated transfer of mature granulocytes from the store in the bone marrow into the blood, and regulated production of new granulocytes.',q:'In which two ways is the number of granulocytes in the blood regulated?',o:['Release from the marrow store, and new production','Release from the spleen, and release from the liver','Changes in plasma volume and in blood viscosity','Division of mature granulocytes in blood and tissue'],a:'Both are regulated in accordance with the body’s needs.'},
  {off:['cyt'],w:{bInf:.04,bCyt:.15,bLeu:.45},set:{vInf:'removed',vCyt:'low',vLeu:'normal',status:'Cause removed'},cap:'The process is terminated by removal of the cause of the infection. The various cytokines also participate in elaborate feedback mechanisms.',q:'What terminates the process?',o:['Removal of the cause of the infection','Exhaustion of the bone marrow','A fall in the number of erythrocytes','The first cytokine that is released'],a:'It starts with an infection, continues with increased mobilization and production of defense cells, and ends when the cause is removed.'}]}}},

{id:'dia',g:'Animations',title:'Diapedesis and chemotaxis',svg:M_DIA,scen:{main:{label:'Leaving the blood',steps:[
  {on:['wN','flow'],cap:'Leukocytes use the blood only as a means of transport. To defend against an infection, they must leave the blood vessel and enter the tissue spaces. Neutrophils and macrophages defend against infections in the tissues.'},
  {on:['chem','src'],cap:'At the site of infection, a chemotactic substance spreads out from the chemotaxis source into the surrounding tissue. Its concentration is highest at the source and falls with distance from it.',q:'Where is the concentration of the chemotactic substance highest?',o:['At the chemotaxis source','Inside the blood vessel','Evenly through the tissue','Next to the bone marrow'],a:'It falls with distance from the source.'},
  {off:['flow'],on:['marg'],cap:'Near the site, leukocytes line up along the inner wall of the vessel and stick to it. This is called margination.',q:'What is margination?',o:['Leukocytes lining up along the vessel wall','Leukocytes squeezing through the vessel wall','Leukocytes moving toward the chemotaxis source','Antibodies helping to select bacteria'],a:'It happens near the site of infection, before the cells leave the vessel.',dur:2600},
  {off:['wN'],on:['wW','perm'],cap:'At the site, the vessel wall becomes more permeable: the spaces between the endothelial cells widen. This is called increased permeability.',q:'Which change in the vessel wall is called increased permeability?',o:['The spaces between endothelial cells widen','The endothelial cells divide rapidly','The vessel wall becomes much thicker','The endothelial cells fill with hemoglobin'],a:'The wider spaces let leukocytes pass through the wall.'},
  {off:['marg'],on:['dia','diaL','zoom'],cap:'Each leukocyte squeezes through a space between two endothelial cells and enters the tissue spaces. This is called diapedesis.',q:'What is diapedesis?',o:['Leukocytes squeezing through the vessel wall','Leukocytes lining up along the vessel wall','Leukocytes moving toward the chemotaxis source','Antibodies helping to select bacteria'],a:'The leukocytes pass through the spaces between the endothelial cells.',dur:4400},
  {off:['dia'],on:['chx','arw'],cap:'The chemotactic substance attracts the leukocytes; this attraction is called chemotaxis. Once in the tissue, they migrate toward the chemotaxis source, where the concentration of the chemotactic substance is highest.',q:'What guides leukocytes to the infection once they are in the tissue?',o:['The chemotactic substance','The flow of blood in the vessel','Heparin released by basophils','Erythropoietin from the kidneys'],a:'They move toward the source, where the concentration is highest.',dur:3000},
  {on:['pha'],cap:'Neutrophils, and monocytes once they have become macrophages in the tissues, engulf the invaders, break them down and digest them: phagocytosis.',q:'Which cells defend against infections by phagocytosis?',o:['Neutrophils and macrophages','Eosinophils and basophils','Lymphocytes and erythrocytes','Basophils and mast cells'],a:'Eosinophils have negligible ability to phagocytize bacteria.'},
  {off:['zoom'],on:['ops'],cap:'Lymphocytes combat microorganisms partly by producing antibodies against them. The selection and phagocytosis process with the help of antibodies is called opsonization.',q:'What is opsonization?',o:['Selection and phagocytosis helped by antibodies','Leukocytes lining up along the vessel wall','Leukocytes squeezing through the vessel wall','Movement toward a chemotactic substance'],a:'The antibodies are produced by lymphocytes.'}]}}},

{id:'infl',g:'Animations',title:'Inflammation',scen:{
 steps:{label:'Steps of inflammation',svg:M_INF1,steps:[
  {on:['vN','wN','flow','bac'],cap:'A break in the skin introduces bacteria, which reproduce at the wound site.',q:'In this example, what starts the inflammation?',o:['Bacteria entering through a break in the skin','Mast cells dividing in the capillary wall','Erythrocytes leaking out of the capillary','Monocytes leaving the bone marrow store'],a:'Inflammation can be started by bacterial invasion or tissue damage.'},
  {on:['mac1','eat1','cyt','chem'],cap:'Activated resident macrophages engulf the pathogens and secrete cytokines and chemotaxins (chemotactic substances). Resident macrophages are macrophages already living in the tissue, like the stationary macrophages described in Module 7.',q:'What do activated resident macrophages secrete at a wound?',o:['Cytokines and chemotaxins','Histamine and heparin','Antibodies and hemoglobin','Erythropoietin and iron'],a:'Chemotaxins are chemotactic substances: they attract phagocytes to the site.'},
  {on:['mast','hist'],cap:'Activated mast cells release histamine. Histamine and the other substances released from mast cells and basophils are also largely responsible for most allergic reactions.',q:'Which cells release histamine at the wound?',o:['Mast cells','Neutrophils','Monocytes','Erythrocytes'],a:'Basophils in the blood resemble the mast cells in the tissues.'},
  {off:['vN','wN','flow'],on:['vD','wW','stick'],cap:'Histamine and cytokines dilate the local blood vessels (the arterioles), so more blood arrives, and widen the capillary pores, the spaces between the endothelial cells. Cytokines also make the vessel wall sticky, so neutrophils and monocytes attach to it.',q:'What makes neutrophils and monocytes attach to the vessel wall?',o:['Cytokines make the wall sticky','Histamine dissolves the wall','Bacteria pull them out of the blood','Erythrocytes push them to the side'],a:'This attachment to the wall is the margination shown in the diapedesis module.',dur:2600},
  {off:['stick'],on:['thru'],cap:'Chemotaxins attract neutrophils and monocytes, which squeeze out between the cells of the blood vessel wall. This process is called diapedesis.',dur:4200},
  {off:['thru'],on:['go','monoGo'],cap:'Guided by the chemotaxins, the neutrophils and monocytes migrate to the infection site.',dur:2600},
  {off:['monoGo'],on:['mac2','kill'],cap:'Monocytes enlarge into macrophages. Newly arriving macrophages and neutrophils engulf the pathogens and destroy them.',q:'Which cells engulf and destroy the pathogens at the wound?',o:['Macrophages and neutrophils','Mast cells and basophils','Erythrocytes and platelets','Lymphocytes and eosinophils'],a:'Monocytes become macrophages once they enter the tissues.',dur:3200},
  {on:['sys'],cap:'Macrophages also secrete cytokines that exert multiple local and systemic effects. For example, cytokines produced by activated leukocytes regulate the production of new leukocytes from stem cells in the bone marrow.',q:'Where can cytokines from the inflamed site act?',o:['Both locally and in the rest of the body','Only inside the macrophage that made them','Only on the bacteria at the wound','Only inside the capillary lumen'],a:'One systemic effect is increased production of leukocytes in the bone marrow.'}]},
 signs:{label:'Signs and outcomes',svg:M_INF2,steps:[
  {on:['f0'],cap:'Bacterial invasion or tissue damage triggers inflammation: mast cells release histamine.',q:'What do mast cells release when tissue is invaded or damaged?',o:['Histamine','Hemoglobin','Erythropoietin','Bilirubin'],a:'Histamine has two local effects on the blood vessels.'},
  {on:['fL'],cap:'Histamine causes local arteriolar vasodilation, which increases blood delivery to the injured tissue. This produces redness and heat.',q:'Which two signs of inflammation come from increased blood delivery?',o:['Redness and heat','Swelling and pain','Pain and fever','Heat and swelling'],a:'More blood flows through the injured tissue.'},
  {on:['fR'],cap:'Histamine also increases local capillary permeability, so fluid accumulates in the tissue. This produces swelling and pain.',q:'What causes the swelling at an inflamed site?',o:['Local accumulation of fluid','Increased blood delivery','Division of mast cells','Phagocytic secretions'],a:'The leakier capillaries let fluid accumulate in the tissue.'},
  {on:['fP'],cap:'Increased blood delivery and leakier capillaries together raise the amount of crucial plasma proteins in the tissue, such as the clotting (coagulation) factors.',q:'Which plasma proteins does the inflamed tissue gain, for example?',o:['Clotting factors','Hemoglobin','Ferritin','Erythropoietin'],a:'One clotting factor is fibrinogen, which is converted to insoluble fibrin during coagulation.'},
  {on:['fH'],cap:'They also raise the number of phagocytes in the tissue: more leukocytes are delivered, and they leave the leaky capillaries by diapedesis.',q:'How do more phagocytes reach the inflamed tissue?',o:['More blood brings them, and they leave by diapedesis','They are formed inside the inflamed tissue','Mast cells divide and become phagocytes','Erythrocytes turn into phagocytes'],a:'Neutrophils and monocytes leave through the widened capillary pores.'},
  {on:['fO'],cap:'Phagocytes produce secretions. Together with the plasma proteins, the phagocytes and their secretions defend against the foreign invader and support tissue repair. Phagocytic secretions also cause systemic responses, such as fever.',q:'Which systemic response can phagocytic secretions cause?',o:['Fever','Redness','Local swelling','Wider capillary pores'],a:'Redness, local swelling and wider pores are local effects.'},
  {on:['fB'],cap:'A blood sample can also reflect inflammation. A serious infection releases stored leukocytes from the bone marrow, so their number in the blood rises (leukocytosis), and the erythrocyte sedimentation rate is increased in inflammation. As with fever and increased numbers of leukocytes, an increased sedimentation rate is a non-specific indicator of disease. Measuring it is clinically useful in dogs and pigs, but not in horses or ruminants.',q:'Why is an increased sedimentation rate called a non-specific indicator?',o:['It shows disease but not which disease','It is found only in healthy animals','It identifies the exact bacterium','It rises only in tumour formation'],a:'Fever and increased numbers of leukocytes are also non-specific indicators of disease.'}]}}},

{id:'gran',g:'Animations',title:'Granulocytes at work',scen:{
 neu:{label:'Neutrophil and bacteria',svg:M4A,steps:[
  {on:['store'],cap:'Most of the leukocytes in the large store in the bone marrow are neutrophils. In the dog and the horse, neutrophils are also more than half of the leukocytes in the blood.',q:'Which cells make up most of the leukocyte store in the bone marrow?',o:['Neutrophils','Lymphocytes','Eosinophils','Monocytes'],a:'This store is released rapidly during acute bacterial infections.'},
  {on:['nV','tB'],cap:'Granulocytes have a short lifespan. Once released from the bone marrow, they circulate in the blood for 4–8 hours.',q:'How long do granulocytes remain in the blood?',o:['4–8 hours','3–4 days','About 10 days','90–140 days'],a:'They then leave the bloodstream for the peripheral tissues.'},
  {on:['bac1','bac2'],cap:'A bacterial infection arises. Neutrophils are particularly efficient in combating bacterial infections.',q:'Against which kind of infection are neutrophils particularly efficient?',o:['Bacterial infections','Parasite infections','Viral infections','Fungal infections only'],a:'Neutrophils have a main role in the defense against bacterial infections.'},
  {off:['nV'],on:['nm','chem'],cap:'Large numbers of neutrophils migrate to the infected area and attack the invasive bacteria. Each one squeezes through a space between the endothelial cells (diapedesis) and moves toward the chemotactic substance spreading from the infection (chemotaxis).',dur:5400},
  {off:['nm','bac2'],on:['nAt','n2','eat'],cap:'Neutrophils engulf the invading bacteria, break them down, and digest their cellular material: phagocytosis.'},
  {off:['n2'],on:['dead'],cap:'During this process, the neutrophils are also rapidly destroyed. The neutrophilic granulocytes can be considered the body’s “stormtroopers” in the defense against bacteria.',q:'What happens to the neutrophils while they attack the bacteria?',o:['They are rapidly destroyed','They divide to form more neutrophils','They turn into macrophages','They return to the bone marrow'],a:'That is why an extensive supply of new neutrophils is necessary.'},
  {on:['more'],cap:'To sustain a high number in the blood, an extensive supply of new neutrophils is necessary. The number of neutrophils mobilized from the bone marrow store increases greatly during acute bacterial infections.',q:'What happens to the number of neutrophils mobilized from the bone marrow store during acute bacterial infections?',o:['It increases greatly','It falls to zero','It does not change','It decreases slightly'],a:'Most of the leukocytes in the bone marrow store are neutrophils.'},
