/* ---------- 7. Differential count lab ---------- */
function buildDiff(stage,extra){
  const TY=[['Neutrophil',NEU,44],['Eosinophil',EOS,44],['Basophil',BAS,40],['Monocyte',MONO,52],['Lymphocyte',LYM,30]];
  const KEYT=['Irregular, multi-lobed nucleus; faint granules','Large orange-red granules; nucleus still visible','Dark blue granules covering much of the nucleus','Kidney-shaped nucleus; larger than a lymphocyte','Small cell, almost filled by a round nucleus'];
  const HINT=['Look again: an irregular nucleus with several lobes, and faint granules.','Look again: large orange-red granules, with the nucleus still visible.','Look again: dark blue granules that cover much of the nucleus.','Look again: a large cell with a kidney-shaped nucleus.','Look again: a small cell, almost filled by a round nucleus.'];
  const COL=['ngran','eos','basg','mono','lymph'];
  const DOG=T95[4][2],DOGMID=12;
  const NAME={Man:'humans',Horse:'the horse',Cow:'the cow',Pig:'the pig',Dog:'the dog',Sheep:'the sheep',Hen:'the hen'};
  const RANGE=Object.fromEntries(T95.map(r=>[r[0],r[1]]));
  const SAMPLES=[...[4,1,2,3,5,0,6].map(j=>({n:`${T95[j][0]}: healthy individual`,sp:T95[j][0],p:T95[j][2]})),
    {n:'Mystery dog 1',cs:'bact',tot:28,p:[87,1,0,2,10]},{n:'Mystery dog 2',cs:'para',tot:14,p:[62,15,1,3,19]},{n:'Mystery dog 3',cs:'viral',tot:5,p:[45,3,0,4,48]}];
  const CASE={
    bact:{o:['An acute bacterial infection','A parasite infection or an allergic reaction','A viral infection','A normal count for a dog'],a:'The total count (28) is above the dog’s range of 6–18: leukocytosis. Neutrophils are about 24 × 10⁹/L, against about 8.4 in an average dog. The number of neutrophils mobilized from the bone marrow store increases greatly during acute bacterial infections.'},
    para:{o:['A parasite infection or an allergic reaction','An acute bacterial infection','A viral infection','A normal count for a dog'],a:'The total count (14) is within the dog’s range, but eosinophils are about 2.1 × 10⁹/L, against about 0.4 in an average dog: more than five times as many. The number of eosinophils increases during allergic reactions and in response to parasite infection.'},
    viral:{o:['A viral infection','An acute bacterial infection','A parasite infection or an allergic reaction','A normal count for a dog'],a:'The total count (5) is below the dog’s range: leukopenia. Neutrophils are about 2.3 × 10⁹/L, against about 8.4 in an average dog, while lymphocytes (about 2.4) are close to the average dog’s 2.8. The lymphocyte share rose only because the neutrophils fell. During viral infections, the number of neutrophils in the blood may be reduced.'}};
  const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const exact=p=>{const tot=p.reduce((a,b)=>a+b,0),sc=p.map(v=>v*100/tot),fl=sc.map(Math.floor);const rem=100-fl.reduce((a,b)=>a+b,0);sc.map((v,i)=>[v-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,rem).forEach(([,i])=>fl[i]++);return fl;};
  const sample=(p,r)=>{const tot=p.reduce((a,b)=>a+b,0);let c;for(let t=0;t<60;t++){c=[0,0,0,0,0];for(let k=0;k<100;k++){let u=r()*tot,i=0;while(i<4&&u>=p[i]){u-=p[i];i++;}c[i]++;}
    if(c.every((v,i)=>{const q=p[i]/tot;return Math.abs(v-100*q)<=Math.max(1,2*Math.sqrt(100*q*(1-q)));}))break;}return c;};
  const HRBC=(x,y,rot)=>`<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse rx="20" ry="12" class="f-rbc"/><ellipse rx="6.5" ry="4.2" class="f-nuc"/></g>`;
  const f1x=v=>(Math.round(v*10)/10).toFixed(1);
  let cur,seq,idx,tally,done,final,run=0;
  stage.innerHTML=`<div class="labgrid"><svg viewBox="0 0 340 340" role="img" aria-label="Microscope field with one leukocyte among erythrocytes">${DEFS}<defs><clipPath id="fclip"><circle cx="170" cy="170" r="157"/></clipPath></defs><circle cx="170" cy="170" r="160" class="field"/><g clip-path="url(#fclip)" id="dField"></g></svg>
  <div class="labctl">
    <label>Blood sample<select id="dS">${SAMPLES.map((s,i)=>`<option value="${i}">${s.n}</option>`).join('')}</select></label>
    <p class="note" id="dTot" style="margin:0 0 6px"></p>
    <p class="mq" id="dProg" style="margin:0 0 10px"></p>
    <div class="dbtns" id="dBtns">${TY.map((t,i)=>`<button data-i="${i}">${t[0]}</button>`).join('')}</div>
    <p class="fb" id="dFb" aria-live="polite"></p>
    <div class="row" style="margin-bottom:16px"><button id="dRest">Count the rest for me</button><button id="dReset">New sample</button></div>
    <div class="scroll"><table class="labt bars" id="dTab"></table></div>
  </div></div>`;
  extra.innerHTML=`<div class="row"><button id="dKeyB" aria-expanded="false">Show the identification key</button></div>
  <div class="keyrow" id="dKeyRow" hidden>${TY.map((t,i)=>`<figure><svg viewBox="-60 -60 120 120" role="img" aria-label="${t[0]}">${t[1](t[2])}</svg><b>${t[0]}</b>${KEYT[i]}</figure>`).join('')}</div>
  <div id="dRes"></div>
  <div class="info" style="max-width:none"><h3>Total number of leukocytes and average distribution of the types</h3>
  <div class="scroll"><table class="labt" style="margin-top:8px"><tr><th>Species</th><th class="num">Total (× 10⁹/L)</th><th class="num">Neutrophils (%)</th><th class="num">Eosinophils (%)</th><th class="num">Basophils (%)</th><th class="num">Monocytes (%)</th><th class="num">Lymphocytes (%)</th></tr>
  ${T95.map(([n,t,p])=>`<tr><td>${n}</td><td class="num">${t}</td>${p.map(v=>`<td class="num">${pct(v)}</td>`).join('')}</tr>`).join('')}</table></div>
  <p class="note">Determining the relative numbers of the different types of leukocytes is called differential counting. Here you count 100 leukocytes, so each count is also a percentage. The healthy samples are drawn at random from the species averages, so they vary a little each time, as real counts do. The mystery samples are teaching examples: the direction of each change follows the text, but the numbers are illustrative. Cell colours follow the usual appearance of a stained blood smear.</p></div>`;
  function field(){const r=rng(SAMPLES.indexOf(cur)*1000+idx+7+run*131);let g='';const hen=cur.sp==='Hen';
    for(let i=0;i<15;i++){const a=r()*6.283,d=72+r()*92,x=f1(170+Math.cos(a)*d),y=f1(170+Math.sin(a)*d);g+=hen?HRBC(x,y,Math.floor(r()*180)):R(x,y,17);}
    if(done)g+=`<rect x="62" y="148" width="216" height="44" rx="22" class="elb"/>`+T(170,177,'100 cells counted','t-c t-l');
    else{const t=seq[idx];g+=`<g transform="translate(170 170) rotate(${Math.floor(r()*360)})">${TY[t][1](TY[t][2])}</g>`;}
    $('#dField').innerHTML=g;}
  function table(){const ref=cur.cs?DOG:cur.p,abs=done&&cur.cs;
    $('#dTab').innerHTML=`<tr><th>Cell type</th><th>Counted (%)</th>${done?`<th class="num">${cur.cs?'Average dog (%)':'Species average (%)'}</th>`:''}${abs?'<th class="num">This dog (× 10⁹/L)</th><th class="num">Average dog (× 10⁹/L)</th>':''}</tr>`+
      TY.map((t,i)=>`<tr><td>${t[0]}s</td><td><span class="bar" style="width:${tally[i]*1.5}px;background:var(--${COL[i]})"></span>${tally[i]}</td>${done?`<td class="num">${pct(ref[i])}</td>`:''}${abs?`<td class="num">${f1x(tally[i]*cur.tot/100)}</td><td class="num">${f1x(ref[i]*DOGMID/100)}</td>`:''}</tr>`).join('');}
  function prog(){$('#dProg').textContent=done?'Count finished: 100 cells.':`Cell ${idx+1} of 100: which type is this?`;$('#dRest').disabled=done||idx<10;$('#dRest').title=idx<10&&!done?'Identify 10 cells yourself first':'';document.querySelectorAll('#dBtns button').forEach(b=>b.disabled=done);}
  function finish(){done=true;tally=final.slice();field();table();prog();$('#dFb').className='fb';$('#dFb').textContent='';
    const res=$('#dRes');
    if(cur.cs){const C=CASE[cur.cs],key='diff|'+cur.cs;delete S.ans[key];
      res.innerHTML=`<div class="info"><h3>From shares to numbers</h3><p>A share alone cannot show whether a cell type has increased or decreased in number. Multiply each percentage by the total count: for example, ${tally[0]}% of ${cur.tot} × 10⁹/L is ${f1x(tally[0]*cur.tot/100)} × 10⁹ neutrophils per liter. The average dog column assumes a total of ${DOGMID} × 10⁹/L, the middle of the dog’s range of 6–18.</p></div>`+mcqBlock(`Compare ${cur.n.toLowerCase()} with the average dog. What does this count point to?`,C.o,C.a,key).replace('<b class="k">Ask the class</b>','');wireMcq(res);}
    else{const b=cur.p[2];res.innerHTML=`<div class="info"><h3>Your count for ${NAME[cur.sp]}</h3><p>Compare your column with the species average beside it. With only 100 cells, chance alone shifts each percentage by a few points, and the relative numbers of the types also vary considerably between healthy individuals. Press New sample to count another healthy ${cur.sp==='Man'?'person':cur.sp.toLowerCase()}.${b<1?` Basophils average only ${b}% in this species, so a 100-cell count often finds none.`:''}${cur.sp==='Hen'?' Bird erythrocytes have a nucleus and are larger than mammalian erythrocytes, as in this field.':''}</p></div>`;}}
  function reset(){cur=SAMPLES[+$('#dS').value];run++;
    final=cur.cs?exact(cur.p):sample(cur.p,rng(SAMPLES.indexOf(cur)*977+13+run*7919));seq=[];final.forEach((c,i)=>{for(let k=0;k<c;k++)seq.push(i);});
    const r=rng(SAMPLES.indexOf(cur)*977+29+run*104729);for(let i=seq.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[seq[i],seq[j]]=[seq[j],seq[i]];}
    $('#dTot').textContent=cur.cs?`Total leukocyte count of this dog: ${cur.tot} × 10⁹/L (dog range 6–18).`:`Total leukocyte count for ${NAME[cur.sp]}: ${RANGE[cur.sp]} × 10⁹/L.`;
    idx=0;tally=[0,0,0,0,0];done=false;$('#dRes').innerHTML='';$('#dFb').textContent='';$('#dFb').className='fb';field();table();prog();}
  document.querySelectorAll('#dBtns button').forEach(b=>b.onclick=()=>{if(done)return;const i=+b.dataset.i,t=seq[idx],fb=$('#dFb');
    if(i===t){tally[i]++;idx++;fb.className='fb good';fb.textContent=`Correct: ${TY[t][0].toLowerCase()}.`;if(idx>=100){finish();return;}field();table();prog();}
    else{fb.className='fb bad';fb.textContent=HINT[t];}});
  $('#dRest').onclick=finish;$('#dReset').onclick=reset;$('#dS').onchange=reset;
  $('#dKeyB').onclick=()=>{const row=$('#dKeyRow'),b=$('#dKeyB');row.hidden=!row.hidden;b.setAttribute('aria-expanded',!row.hidden);b.textContent=row.hidden?'Show the identification key':'Hide the identification key';};
  reset();
}

/* ---------- 8. Total leukocyte count ---------- */
function buildTotal(stage,extra){
  const RG={Man:[3,11],Horse:[5,12],Cow:[4,9],Pig:[11,22],Dog:[6,18],Sheep:[3,11],Hen:[20,30]};
  const NAME={Man:'humans',Horse:'the horse',Cow:'the cow',Pig:'the pig',Dog:'the dog',Sheep:'the sheep',Hen:'the hen'};
  const LAB={low:'leukopenia',ok:'within the normal range',high:'leukocytosis'};
  const Q=[{sp:'Dog',v:24,a:'high',w:'An abnormally high number of leukocytes is called leukocytosis.'},
   {sp:'Pig',v:15,a:'ok',w:'The same count would be above the range of a horse, cow, sheep or human.'},
   {sp:'Horse',v:3.5,a:'low',w:'An abnormally low number of leukocytes is called leukopenia.'},
   {sp:'Sheep',v:3.5,a:'ok',w:'This is below the general figure of 4 × 10⁹/L, but within the sheep’s own range. Always use the range for the species.'},
   {sp:'Sheep',v:14,a:'high',w:'When the body is threatened by a serious infection, vast numbers of stored leukocytes are rapidly released from the bone marrow.'},
   {sp:'Hen',v:25,a:'ok',w:'The hen has the highest range of the species listed.'},
   {sp:'Man',v:2,a:'low',w:'Leukopenia can arise from drugs that reduce the activity of the bone marrow, such as chemotherapeutic drugs, and from radiation treatment.'},
   {sp:'Cow',v:13,a:'high',w:'The same count would be within the range of a dog or a pig.'},

const sel=(root,k)=>root.querySelectorAll(`[data-k="${k}"],[data-t="${k}"]`);
function apply(root,st,now){
  (st.on||[]).forEach(k=>sel(root,k).forEach(e=>{e.classList.add('on');if(now)e.classList.add('now');}));
  (st.off||[]).forEach(k=>sel(root,k).forEach(e=>e.classList.remove('on','now')));

  for(const[k,v]of Object.entries(st.set||{}))sel(root,k).forEach(e=>e.textContent=CAP(v));

  for(const[k,v]of Object.entries(st.w||{}))sel(root,k).forEach(e=>e.setAttribute('width',(v*+e.dataset.max).toFixed(1)));
}
function tween(e,a,b){const t0=performance.now(),D=700;const f=t=>{const p=Math.min(1,(t-t0)/D),q=1-Math.pow(1-p,3);e.setAttribute('width',(a+(b-a)*q).toFixed(1));if(p<1)requestAnimationFrame(f);};e.setAttribute('width',a.toFixed(1));requestAnimationFrame(f);}

  for(const[k,v]of Object.entries(cur.w||{}))if(k in prevW&&!matchMedia('(prefers-reduced-motion: reduce)').matches)sel(root,k).forEach(e=>tween(e,prevW[k]*e.dataset.max,v*e.dataset.max));
  const hide=S.phase===0;stage.classList.toggle('predict-hide',hide);

function quizRender(){const body=$('#qBody'),nx=$('#qNext');
  if(QZ.i>=QZ.list.length){$('#qProg').textContent='Finished';body.innerHTML=`<p class="qscore">${QZ.score} of ${QZ.list.length}</p><p style="text-align:center;margin:0">answered correctly on the first try.</p>`;nx.textContent='Try again';return;}
  const it=QZ.list[QZ.i],key='quiz|'+QZ.i;delete S.ans[key];
  $('#qProg').textContent=`Question ${QZ.i+1} of ${QZ.list.length}`;
  body.innerHTML=mcqBlock(it.q,it.o,it.a,key).replace('<b class="k">Ask the class</b>','');
  wireMcq(body,first=>{if(first)QZ.score++;});
  nx.textContent=QZ.i===QZ.list.length-1?'See my score':'Next question';}
function openQuiz(){stopPlay();QZ.list=buildTest(S.mod);QZ.i=0;QZ.score=0;QZ.open=true;$('#qT').textContent='Test yourself: '+S.mod.title;$('#quiz').hidden=false;quizRender();setTimeout(()=>$('#qNext').focus(),30);}
function closeQuiz(){QZ.open=false;$('#quiz').hidden=true;}
$('#bTest').onclick=openQuiz;$('#qClose').onclick=closeQuiz;
$('#quiz').addEventListener('click',e=>{if(e.target.id==='quiz')closeQuiz();});
$('#qNext').onclick=()=>{if(QZ.i>=QZ.list.length){QZ.i=0;QZ.score=0;}else QZ.i++;quizRender();};
/* nav */
let navHTML='',lastG='';
MODS.forEach(m=>{if(m.g!==lastG){navHTML+=`<div class="grp">${m.g}</div>`;lastG=m.g;}navHTML+=`<a href="#${m.id}" data-id="${m.id}"><span class="n">${m.n}</span><span>${m.title}</span></a>`;});
$('#nav').innerHTML=navHTML;
$('#bNext').onclick=()=>{stopPlay();next();};
$('#bBack').onclick=()=>{stopPlay();back();};
$('#bPlay').onclick=play;
$('#pred').onchange=e=>{S.predict=e.target.checked;if(S.mod&&S.mod.scen){S.phase=sp();draw();}};
$('#bPresent').onclick=()=>{const on=document.body.classList.toggle('present');$('#bPresent').setAttribute('aria-pressed',on);$('#bPresent').textContent=on?'Show modules':'Present';};
document.addEventListener('keydown',e=>{
  if(S.introOpen){if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();closeIntro();}return;}
  if(QZ.open){if(e.key==='Escape')closeQuiz();return;}
  const tag=(e.target.tagName||'').toLowerCase();if(['input','select','textarea'].includes(tag))return;
  if(e.key==='Escape'&&document.body.classList.contains('present')){$('#bPresent').click();return;}
  if(!S.mod||S.mod.build||$('#panel').hidden)return;
  if(e.key==='ArrowRight'){e.preventDefault();stopPlay();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();stopPlay();back();}
});
window.addEventListener('hashchange',()=>openModule(location.hash.slice(1)));
openModule(location.hash.slice(1));
</script>
